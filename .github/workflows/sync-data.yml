name: Sync game data

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  HUSKY: 0 # Skip the local pre-commit hook in CI.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run sync:data
        env:
          # Unauthenticated runners share a 60-request hourly limit per IP. This token
          # raises the repository's limit to 1,000 requests per hour.
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run sync:enka
        continue-on-error: true
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/data-sync
          delete-branch: true
          commit-message: "chore: sync roster, artifact sets and Enka tables from the build source"
          title: "chore: sync roster, artifact sets and Enka tables from the build source"
          body: |
            Automated weekly sync from the build data source (union-merge, no deletions).
            Review the added characters/sets before merging. New characters get
            region "—" (and a guessed weapon when the script can't read upstream
            metadata). Fill those in here.

            Also regenerates src/data/enka.js from Enka's published store. That step
            runs with continue-on-error, so a failure there (for example, too few
            matched characters) still lets this PR open with the roster and
            artifact set changes.
